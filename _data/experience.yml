# Experience shown on the homepage: one logo per place, with the position under it
# and a panel on hover / click / tap that says what the work was, who it was with and
# what came out of it.
#
#   id       short key; a paper with `place={id}` in papers.bib is listed in this
#            entry's panel, with its clip
#   org      name shown at the top of the panel
#   unit     optional second line (department, team, city)
#   logo     file in assets/img/
#   logo_class  optional class for the logo: logo-boost darkens a pale logo,
#            logo-amazon sizes the Amazon wordmark
#   role     position shown under the logo
#   title    optional longer title for the panel (defaults to role)
#   period   dates shown in the panel
#   summary  about three sentences on the work, shown when the logo is opened
#   people   optional list: name, title (their own current title), at (where
#            they hold it, when that is not this place), url, photo, and
#            photo_still (a still shown instead of an animated photo to
#            visitors who ask for reduced motion)
#            photo is a file in assets/img/people/ (square, ~160px);
#            without it the panel shows the person's initials.

academia:
  - id: jhu
    org: Johns Hopkins University
    unit: Computational Cognitive Science
    logo: jhu.png
    role: PhD student
    period: 2023 – present
    summary: >-
      I study how brains and deep networks come to represent visual information, with a focus on computational models of visual processing. One line of work shows that vision models trained on extremely coarse objectives, as few as eight classes, still learn representations aligned with human judgments and visual cortex. I also build closed-loop AI systems for neuroscientific discovery, in which models propose, evaluate and refine hypotheses on neural data.
    people:
      - name: Michael F. Bonner
        title: Assistant Professor of Cognitive Science
        url: https://bonnerlab.org/
        photo: bonner.jpg

  - id: janelia
    org: HHMI Janelia Research Campus
    logo: janelia.png
    role: Research Engineer 2
    period: Jan 2022 – Sep 2023
    summary: >-
      I worked directly with experimental neuroscientists to build connectome-constrained neural network models that can be fit end to end to recorded data. I used the framework to infer synaptic plasticity rules from learning dynamics. It recovered known rules and identified active forgetting in fly reward-learning data.
    people:
      - name: James Fitzgerald
        title: Associate Professor
        at: Northwestern University
        url: https://shorturl.at/lyzFR
        photo: fitzgerald.jpg
      - name: Jan Funke
        title: Senior Group Leader
        at: Human Technopole
        url: https://shorturl.at/dfuyQ
        photo: funke.jpg

  - id: freiburg
    org: University of Freiburg
    unit: Machine Learning Lab
    logo: uni_freiburg.png
    logo_class: logo-boost
    role: ML Research Engineer
    period: Aug 2020 – Dec 2021
    summary: >-
      I implemented and benchmarked neural architecture search algorithms across vision, NLP, speech and detection. I built a unified interface for evaluating new search methods across datasets and search spaces, released as NAS-Bench-Suite in the open-source NASLib. With it we showed that conclusions drawn from a few benchmarks often do not carry over to others.
    people:
      - name: Frank Hutter
        title: Professor of Machine Learning
        url: https://shorturl.at/nrBEJ
        photo: hutter.jpg

  - id: gatsby
    org: Gatsby Computational Neuroscience Unit
    unit: University College London
    logo: gatsby.png
    logo_class: logo-boost
    role: Research Resident
    period: Jan 2019 – Jun 2020
    summary: >-
      I was the first Research Resident at Gatsby, working with Peter Latham and Tim Lillicrap on learning rules a brain could plausibly use. I implemented node perturbation and other local learning rules directly from their weight-update equations. I built efficient training code for per-weight updates and scaled it across GPUs, which made large experiments with these rules practical.
    people:
      - name: Peter Latham
        title: Professor of Theoretical Neuroscience
        url: https://www.gatsby.ucl.ac.uk/~pel/
        photo: latham.jpg
      - name: Timothy Lillicrap
        title: Director of Research
        at: Google DeepMind
        url: https://scholar.google.com/citations?user=htPVdRMAAAAJ&hl=en
        photo: lillicrap.jpg

  - id: ntu
    org: NTU Singapore
    logo: ntu.png
    role: Undergraduate thesis
    period: "2018"
    summary: >-
      For my undergraduate thesis I worked on predicting personality traits from text with language models. I combined psycholinguistic features with language-model embeddings to predict the Big Five traits. The work grew into a survey of deep learning for personality detection and several follow-up papers.
    people:
      - name: Erik Cambria
        title: Professor of Artificial Intelligence
        url: https://scholar.google.com/citations?user=ilSYpW0AAAAJ&hl=en&inst=7575085548378563675
        photo: cambria.jpg

industry:
  - id: msr
    org: Microsoft Research
    unit: Deep Learning team, Redmond
    logo: msr.jpeg
    role: Research Intern
    period: Apr 2026 – present
    summary: >-
      I led an open-ended search in which LLM agents write fixed, never-trained brain encoding models as code and improve them from held-out neural predictivity. The search ran across five datasets, two species and three recording modalities. The models it produces are readable programs, not black boxes.
    people:
      - name: Nebojsa Jojic
        title: Senior Principal Researcher
        url: https://www.microsoft.com/en-us/research/people/jojic/
        photo: jojic.jpg
      - name: Chandan Singh
        title: Staff Research Scientist
        at: Voyage AI
        url: https://csinva.io/
        photo: singh.gif
        photo_still: singh.jpg
      - name: Weijia Xu
        title: Senior Researcher
        url: https://www.microsoft.com/en-us/research/people/weijiaxu/
        photo: xu.jpg

  - id: sakana
    org: Sakana AI
    logo: sakana.png
    role: Research Intern
    period: Summer 2025
    summary: >-
      I led IdeaBreeder, a system for open-ended generation of scientific ideas by evolutionary search. It grows trees of research hypotheses through structured LLM mutations. Each idea is reviewed in parallel for novelty, feasibility, usefulness and clarity.
    people:
      - name: Robert Lange
        title: Staff Research Scientist
        url: https://roberttlange.com/
        photo: lange.jpg

  - id: amazon
    org: Amazon
    unit: Bangalore
    logo: amazon.png
    logo_class: logo-amazon
    role: Software Developer
    title: Software Development Engineer
    period: Jul 2018 – Dec 2018
    summary: >-
      I built backend software and data pipelines for Amazon Music on AWS. I also built an LSTM system for music emotion classification that placed second in Amazon’s global ML hackathon. I left after six months to pursue research.
