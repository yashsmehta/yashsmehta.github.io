<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Source+Serif+4:opsz,wght@8..60,400..600&display=block" rel="stylesheet">
<style>html,body{margin:0;width:640px;height:448px;overflow:hidden;background:#fffdf9}
svg{display:block}text{font-family:"Bricolage Grotesque";}</style>
<svg id="s" width="640" height="448" viewBox="0 0 640 448" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf9"/><stop offset="1" stop-color="#f8f5ee"/></linearGradient></defs>
<rect width="640" height="448" fill="url(#bg)"/>
<text x="40" y="100" font-size="27" font-weight="600" fill="#0f1c33">Predicting <tspan fill="#e0811f">personality</tspan> from digital footprints</text>
<g id="paths" fill="none" stroke="#e4ddcf" stroke-width="2"></g>
<g id="tiles"></g>
<g id="model"></g>
<g id="bars"></g>
<g id="dots"></g>
<text x="85" y="372" font-size="16" font-weight="500" fill="#445267" text-anchor="middle">footprints</text>
<text x="300" y="372" font-size="16" font-weight="500" fill="#445267" text-anchor="middle">model</text>
<text x="528" y="372" font-size="16" font-weight="500" fill="#445267" text-anchor="middle">Big Five traits</text>
</svg>
<script>
const NS='http://www.w3.org/2000/svg';
const el=(p,n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const $=id=>document.getElementById(id);
const clamp=x=>Math.max(0,Math.min(1,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const mix=(a,b,u)=>{const h=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=h(a),B=h(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*u)).join(',')+')'};
const bez=(P,u)=>{const v=1-u;return [0,1].map(i=>v*v*v*P[0][i]+3*v*v*u*P[1][i]+3*v*u*u*P[2][i]+u*u*u*P[3][i])};
const pd=P=>`M${P[0]} C${P[1]} ${P[2]} ${P[3]}`;
const CY=250, SY=[190,250,310], BY=[178,214,250,286,322];
const LEV=[0.74,0.46,0.88,0.62,0.36]; // schematic levels, not data
const inP=SY.map(y=>[[114,y],[190,y],[196,CY],[256,CY]]);
const outP=BY.map(y=>[[344,CY],[398,CY],[388,y],[438,y]]);
inP.concat(outP).forEach(P=>el($('paths'),'path',{d:pd(P)}));
// source tiles
const tiles=SY.map((y,k)=>{const g=el($('tiles'),'g',{transform:`translate(60,${y-25})`});
  const r=el(g,'rect',{width:50,height:50,rx:11,fill:'#fff',stroke:'#e4ddcf','stroke-width':2});
  const a={fill:'none',stroke:'#1a55b4','stroke-width':2.6,'stroke-linecap':'round','stroke-linejoin':'round'};
  if(k==0){el(g,'path',{...a,d:'M13 17H37M13 25H37M13 33H28'})}
  if(k==1){el(g,'path',{...a,d:'M25 36C10 26 14 14 20.5 14C23 14 24.5 15.5 25 17C25.5 15.5 27 14 29.5 14C36 14 40 26 25 36Z'})}
  if(k==2){el(g,'rect',{...a,x:16,y:11,width:18,height:28,rx:4});el(g,'path',{...a,d:'M23 33H27'})}
  return r});
// model
const mg=$('model');
const mbox=el(mg,'rect',{x:258,y:208,width:84,height:84,rx:16,fill:'#fff',stroke:'#0f1c33','stroke-width':2.2});
const L=[[[278,234],[278,266]],[[300,226],[300,250],[300,274]],[[322,234],[322,266]]];
for(let c=0;c<2;c++)for(const a of L[c])for(const b of L[c+1])el(mg,'line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#c9cfd8','stroke-width':1.6});
const nodes=[];L.forEach((col,c)=>col.forEach((p,i)=>nodes.push({c,i,e:el(mg,'circle',{cx:p[0],cy:p[1],r:5.5,fill:'#fff',stroke:'#002d72','stroke-width':2})})));
// bars
const X0=468,XW=132;
const bars=BY.map((y,i)=>{el($('bars'),'text',{x:452,y:y+6,'font-size':17,'font-weight':600,fill:'#0f1c33','text-anchor':'middle'}).textContent='OCEAN'[i];
  el($('bars'),'rect',{x:X0,y:y-8,width:XW,height:16,rx:8,fill:'#f1ece1'});
  return el($('bars'),'rect',{x:X0,y:y-8,width:0,height:16,rx:8,fill:'#e0811f'})});
// dots
const inD=[],outD=[];
SY.forEach((y,k)=>{for(let j=0;j<6;j++)inD.push({P:inP[k],k,t0:0.6+k*0.22+j*0.6,d:1.15,e:el($('dots'),'circle',{r:4.5,fill:'#68ace5'})})});
BY.forEach((y,i)=>{for(let j=0;j<3;j++)outD.push({P:outP[i],t0:3.0+i*0.5+j*0.4,d:0.75,e:el($('dots'),'circle',{r:4.5,fill:'#e0811f'})})});
window.DURATION=8.4;
window.renderAt=t=>{
  for(const D of inD.concat(outD)){const u=(t-D.t0)/D.d;
    if(u<=0||u>=1){D.e.setAttribute('opacity',0);continue}
    const p=bez(D.P,ease(u));D.e.setAttribute('cx',p[0]);D.e.setAttribute('cy',p[1]);
    D.e.setAttribute('opacity',Math.min(1,u*6,(1-u)*6))}
  // tiles brighten while emitting
  tiles.forEach((r,k)=>{const a=clamp((t-0.4-k*0.22)/0.4)*(1-clamp((t-4.9-k*0.22)/0.6));
    r.setAttribute('stroke',mix('#e4ddcf','#68ace5',a))});
  // model activity
  const act=clamp((t-1.5)/0.6), rest=clamp((t-6.6)/0.8);
  for(const n of nodes){const w=0.5+0.5*Math.sin(t*3.2-n.c*1.3+n.i*2.1);
    const v=act*((1-rest)*w+rest*1);
    n.e.setAttribute('fill',mix('#ffffff',n.c==2?'#e0811f':'#1a55b4',v*(n.c==2?clamp((t-2.8)/0.6):1)));
    n.e.setAttribute('stroke',mix('#002d72',n.c==2?'#e0811f':'#1a55b4',v*(n.c==2?clamp((t-2.8)/0.6):1)))}
  bars.forEach((b,i)=>{const u=(t-(3.75+i*0.5))/1.5;b.setAttribute('width',u<=0?0:Math.max(0,XW*LEV[i]*back(u)))});
};
renderAt(0);
</script>
