# Short lines shown under a paper on the publications page while the pointer is over
# it (or it has keyboard focus; on touch screens, after a tap), keyed by the entry's
# BibTeX key in _bibliography/papers.bib. They take the place of the abstract. Keep
# each strictly to one desktop line (~80-83 characters max); double-quote values:
#   question      what was the core scientific question?
#   contribution  my contribution (omitted on 3rd-author papers)
#   findings      what were the key findings?

mehta2026iwsp:
  question: "Can LLM agents code transparent transformers and brain models with zero backprop?"
  contribution: "Designed and led iWSP across transformers and vision, language, and audio cortex."
  findings: "Coded models beat vision baselines, flag an fMRI confound, and map auditory ECoG."

mehta2026coarse:
  question: "Does human-like vision require fine-grained labels, or do coarse signals suffice?"
  contribution: "Conceived and led the study across hundreds of models, brain data, and behavior."
  findings: "Just 8 classes match 1,000 in cortex and beat CLIP and DINOv3 on human perception."

mehta2024model:
  question: "Can we uncover synaptic learning rules from neural activity or behavior alone?"
  contribution: "Conceived and led differentiable rule inference across circuits and fly behavior."
  findings: "Recovers Oja's and reward rules and reveals active synaptic forgetting in flies."

hiratani2022stability:
  question: "Can reward-driven noise perturbation train deep networks stably without backprop?"
  contribution: "Co-designed the study, built GPU-scale local-update code, and ran deep benchmarks."
  findings: "Scales with width, but mismatch causes weight blow-up—stabilized by normalization."

mehta2022bench:
  question: "Do architecture search findings hold beyond small CIFAR classification benchmarks?"
  contribution: "Co-led NAS-Bench-Suite, unifying 25 vision, speech, and NLP benchmarks in NASLib."
  findings: "NAS rankings flip across 25 tasks; fusing zero-cost proxies boosts predictors 42%."

mehta2022future:
  question: "What limits valid, ethical personality inference from passive digital footprints?"
  contribution: "Managing Guest Editor: ran the FGCS issue (6/25 accepted) and wrote its roadmap."
  findings: "Charts the shift to multimodal models and key validity, bias, and privacy hurdles."

li2020multitask:
  question: "Can jointly learning transient emotions and stable traits boost both predictions?"
  findings: "Meta-learned task sharing prevents negative transfer and beats BERT baselines."

pogodin2021towards:
  question: "How can brains match convolutional vision when real neurons cannot share weights?"
  contribution: "Co-designed the study, built ImageNet-scale local networks, and led related work."
  findings: "Sleep-like Hebbian phases cut the ImageNet gap (16.8→4.2%) and boost V4/IT fit."

mehta2020recent:
  question: "How do deep unimodal and multimodal models compare for personality detection?"
  contribution: "Led the survey, building a taxonomy of text, audio, video, and multimodal models."
  findings: "Trimodal fusion wins, while Big Five (science) and MBTI (industry) sharply split."

mehta2020bottom:
  question: "Does fusing psycholinguistic priors with language models beat either stream alone?"
  contribution: "Led the study: fused psycholinguistic priors with LMs and quantified cue impact."
  findings: "Sets SOTA on Essays (+1.6%) and MBTI (+1.0%) and maps which cues drive each trait."

kazameini2020personality:
  question: "How can BERT score personality across long essays without costly full fine-tuning?"
  findings: "Bagged SVMs over chunked BERT embeddings beat SOTA (+1.04%) in 7 min vs. 50 hours."
