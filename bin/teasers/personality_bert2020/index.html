<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Source+Serif+4:opsz,wght@8..60,400..600&display=block" rel="stylesheet">
<style>html,body{margin:0;width:640px;height:448px;overflow:hidden;background:#fffdf9}
svg{display:block}text{font-family:"Bricolage Grotesque";}</style>
<svg id="s" width="640" height="448" viewBox="0 0 640 448" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('s');
function el(n,a,txt){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;svg.appendChild(e);return e}
let seed=7;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const cl=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=cl(x);return x*x*(3-2*x)},seg=(t,a,b)=>ease((t-a)/(b-a)),lerp=(a,b,u)=>a+(b-a)*u;
const back=x=>{x=cl(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const INK='#0f1c33',SOFT='#445267',FAINT='#6c7788',LINE='#e4ddcf',WASH='#f1ece1',NAVY='#002d72',GREEN='#1e8f6b';
const COL=['#68ace5','#58c39b','#e0811f','#1a55b4'];
const RY=[176,222,268,314],CY=245,VOTE=[1,1,0,1];
el('rect',{x:0,y:0,width:640,height:448,fill:'#fffdf9'});
// heading
const h=el('text',{x:34,y:92,'font-size':27,'font-weight':600,fill:INK});
h.innerHTML='Split the essay, let bagged SVMs <tspan fill="#1a55b4">vote</tspan>';
// row guide lines
const guides=RY.map(y=>el('line',{x1:150,x2:470,y1:y,y2:y,stroke:LINE,'stroke-width':2}));
// page outline
const page=el('rect',{x:34,y:176,width:116,height:138,rx:8,fill:'#fff',stroke:LINE,'stroke-width':2});
// cards
const cards=RY.map((y,i)=>{const g=el('g',{});const r=el('rect',{x:34,y:-17,width:116,height:34,rx:7,fill:'#fff',stroke:COL[i],'stroke-width':2});g.appendChild(r);
  const w=[[92,70],[86,92],[92,58],[80,90]][i];
  const b1=el('rect',{x:46,y:-9,width:w[0],height:6,rx:3});const b2=el('rect',{x:46,y:3,width:w[1],height:6,rx:3});g.appendChild(b1);g.appendChild(b2);return {g,r,b:[b1,b2]}});
// BERT
el('rect',{x:182,y:156,width:60,height:178,rx:10,fill:WASH,stroke:LINE,'stroke-width':2});
const bertGlow=el('rect',{x:182,y:156,width:60,height:178,rx:10,fill:'none',stroke:'#68ace5','stroke-width':3,opacity:0});
el('text',{x:212,y:250.5,'font-size':16,'font-weight':600,fill:SOFT,'text-anchor':'middle'},'BERT');
// vectors
const vecs=RY.map((y,i)=>{const cs=[];for(let k=0;k<5;k++){cs.push(el('rect',{x:262+k*14,y:y-8,width:12,height:16,rx:3,fill:COL[i],'data-o':(0.35+0.65*rnd()).toFixed(2)}))}return cs});
// SVM panel
const PX=352,PW=104,PY=156,PH=178,PCX=PX+PW/2;
el('rect',{x:PX,y:PY,width:PW,height:PH,rx:10,fill:'#fff',stroke:LINE,'stroke-width':2});
const DIRS=[[1,-1.3],[1,-0.95],[1,-1.8]];
for(let n=0,c=0;c<20&&n<400;n++){const x=PX+12+rnd()*(PW-24),y=PY+12+rnd()*(PH-24);const d=(-1.3*(x-PCX)-(y-CY))/1.64;if(Math.abs(d)<17)continue;c++;
  if(d>0)el('circle',{cx:x,cy:y,r:3.6,fill:FAINT,opacity:.75});else el('circle',{cx:x,cy:y,r:3,fill:'#fff',stroke:FAINT,'stroke-width':1.6,opacity:.9});}
const clip=el('clipPath',{id:'pc'});clip.appendChild(el('rect',{x:PX+3,y:PY+3,width:PW-6,height:PH-6,rx:8}));
const svmLines=DIRS.map(d=>{const L=Math.hypot(d[0],d[1]),ux=d[0]/L,uy=d[1]/L,R=110;return {l:el('line',{stroke:NAVY,'stroke-width':2.5,'stroke-linecap':'round','clip-path':'url(#pc)'}),ux,uy,R}});
const TG=[[378,198],[370,234],[432,274],[364,256]];
const dots=RY.map((y,i)=>el('circle',{r:6.5,fill:COL[i],stroke:'#fff','stroke-width':2}));
// vote lines + chips + final
const FX=574,CXp=488;
const vlines=RY.map((y,i)=>el('path',{fill:'none',stroke:VOTE[i]?GREEN:'#c9c2b4','stroke-width':2.5,'stroke-linecap':'round'}));
const chips=RY.map((y,i)=>{const g=el('g',{});g.appendChild(el('circle',{r:13,fill:VOTE[i]?GREEN:'#fff',stroke:VOTE[i]?GREEN:FAINT,'stroke-width':2}));
  g.appendChild(el('path',{d:VOTE[i]?'M-6 0.5 L-2 4.5 L6 -4.5':'M-4.5 -4.5 L4.5 4.5 M4.5 -4.5 L-4.5 4.5',fill:'none',stroke:VOTE[i]?'#fff':FAINT,'stroke-width':2.6,'stroke-linecap':'round','stroke-linejoin':'round'}));return g});
const finalRing=el('circle',{cx:FX,cy:CY,r:28,fill:'#fffdf9',stroke:FAINT,'stroke-width':2,'stroke-dasharray':'5 5'});
const finalFill=el('circle',{cx:FX,cy:CY,r:28,fill:GREEN});
const tick=el('path',{d:'M-13 1 L-4 10 L13 -9',fill:'none',stroke:'#fff','stroke-width':4.5,'stroke-linecap':'round','stroke-linejoin':'round',transform:`translate(${FX},${CY})`,'stroke-dasharray':40});
// labels
const lab=(x,s)=>el('text',{x,y:366,'font-size':16,'font-weight':500,fill:SOFT,'text-anchor':'middle'},s);
const lEssay=lab(92,'essay'),lSub=lab(92,'sub-documents');lab(PCX,'bagged SVM');lab(FX,'trait');
window.DURATION=9;
window.renderAt=function(t){
  // split
  const sp=seg(t,0.6,1.7);
  page.setAttribute('opacity',1-sp);
  lEssay.setAttribute('opacity',1-seg(t,0.9,1.3));lSub.setAttribute('opacity',seg(t,1.3,1.7));
  cards.forEach((c,i)=>{const y0=CY+(i-1.5)*30,y=lerp(y0,RY[i],sp);c.g.setAttribute('transform',`translate(0,${y})`);
    c.r.setAttribute('opacity',sp);const cu=seg(t,0.6+i*0.08,1.2+i*0.08);
    c.b.forEach(b=>{b.setAttribute('fill',COL[i]);b.setAttribute('opacity',lerp(0,1,cu))});
    // gray underlay via fill mix
    c.b.forEach(b=>{if(cu<1){b.setAttribute('fill',mix('#9aa3b0',COL[i],cu));b.setAttribute('opacity',1)}});
  });
  guides.forEach((g,i)=>g.setAttribute('opacity',seg(t,1.2,1.8)));
  // embed
  let glow=0;
  vecs.forEach((cs,i)=>{const t0=1.9+i*0.3;cs.forEach((c,k)=>{const u=seg(t,t0+0.45+k*0.07,t0+0.75+k*0.07);c.setAttribute('opacity',u*c.getAttribute('data-o'));
      c.setAttribute('transform',`translate(${(1-u)*-10},0)`)});
    const p=cl((t-t0)/0.6);glow=Math.max(glow,Math.sin(Math.PI*p));});
  bertGlow.setAttribute('opacity',glow*0.9);
  // svm lines
  svmLines.forEach((s,j)=>{const u=seg(t,3.7+j*0.3,4.4+j*0.3);s.l.setAttribute('x1',PCX-s.ux*s.R*u);s.l.setAttribute('y1',CY-s.uy*s.R*u);s.l.setAttribute('x2',PCX+s.ux*s.R*u);s.l.setAttribute('y2',CY+s.uy*s.R*u);
    s.l.setAttribute('opacity',u>0?(j==0?1:0.55):0)});
  // classify
  dots.forEach((d,i)=>{const t0=5.0+i*0.35,u=seg(t,t0,t0+0.6);d.setAttribute('cx',lerp(330,TG[i][0],u));d.setAttribute('cy',lerp(RY[i],TG[i][1],u));d.setAttribute('opacity',cl((t-t0)/0.12));
    const cu=cl((t-t0-0.55)/0.35);chips[i].setAttribute('transform',`translate(${CXp},${RY[i]}) scale(${cu<=0?0:back(cu)})`);});
  // vote
  vlines.forEach((p,i)=>{const u=seg(t,6.7+i*0.1,7.3+i*0.1);const x0=CXp+15,y0=RY[i],x1=FX-30,y1=CY+(i-1.5)*9;
    const d=`M${x0} ${y0} C${x0+22} ${y0} ${x1-22} ${y1} ${x1} ${y1}`;p.setAttribute('d',d);const L=110;p.setAttribute('stroke-dasharray',L);p.setAttribute('stroke-dashoffset',L*(1-u));p.setAttribute('opacity',u>0?1:0)});
  const f=cl((t-7.3)/0.45);finalFill.setAttribute('transform',`translate(${FX},${CY}) scale(${f<=0?0:back(f)}) translate(${-FX},${-CY})`);
  finalRing.setAttribute('opacity',1-seg(t,7.5,7.75));
  tick.setAttribute('stroke-dashoffset',40*(1-seg(t,7.6,8.0)));tick.setAttribute('opacity',t>7.6?1:0);
};
function mix(a,b,u){const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)),A=p(a),B=p(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],u))).join(',')+')'}
renderAt(0);
</script>
