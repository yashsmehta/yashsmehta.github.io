<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Source+Serif+4:opsz,wght@8..60,400..600&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:640px;height:448px;overflow:hidden;background:linear-gradient(#fffdf9,#f8f5ee)}
svg{position:absolute;left:0;top:0}
text{font-family:"Bricolage Grotesque";fill:#0f1c33}
</style>
<svg id="s" width="640" height="448" viewBox="0 0 640 448" xmlns="http://www.w3.org/2000/svg">
  <text x="38" y="82" font-size="27" font-weight="600"><tspan fill="#e0811f">No method</tspan> wins on all 25 benchmarks</text>
  <g id="grid"></g>
  <rect id="ring" width="50" height="50" rx="9" fill="none" stroke="#0f1c33" stroke-width="3"/>
  <g id="bars"></g>
  <text x="161" y="402" font-size="15.5" text-anchor="middle" fill="#445267" style="fill:#445267">25 benchmarks</text>
  <text x="330" y="402" font-size="15.5" style="fill:#445267">ranked best to worst, per benchmark</text>
</svg>
<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
  function rng(seed){var a=seed;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function clamp(x){return x<0?0:x>1?1:x}
  function ease(x){x=clamp(x);return x*x*(3-2*x)}
  function mix(a,b,u){var o='#';for(var i=0;i<3;i++){var x=parseInt(a.substr(1+2*i,2),16),y=parseInt(b.substr(1+2*i,2),16);o+=('0'+Math.round(x+(y-x)*u).toString(16)).slice(-2)}return o}

  var METHODS=[['Random search','#002d72'],['Reg. evolution','#68ace5'],['BANANAS','#e0811f'],['Local search','#1e8f6b'],['NPENAS','#d4424e']];
  var M=5,N=25,WASH='#ebe5d8';

  // synthetic, seeded scores: one winner per benchmark, never the same twice in a row
  var r=rng(20220131),scores=[],winner=[],prev=-1,counts=[0,0,0,0,0];
  for(var k=0;k<N;k++){
    var w;do{w=Math.floor(r()*M)}while(w===prev||counts[w]>=(w===0?3:6));
    prev=w;counts[w]++;winner.push(w);
    var order=[0,1,2,3,4].filter(function(m){return m!==w});
    for(var i=order.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var tmp=order[i];order[i]=order[j];order[j]=tmp}
    var s=[];s[w]=0.95+0.05*r();
    for(i=0;i<4;i++)s[order[i]]=0.80-0.15*i-0.05*r();
    scores.push(s);
  }
  function target(k){ // {len[], pos[]} for benchmark k (-1 = neutral legend)
    if(k<0)return{len:[.55,.55,.55,.55,.55],pos:[0,1,2,3,4]};
    var s=scores[k],idx=[0,1,2,3,4].sort(function(a,b){return s[b]-s[a]}),pos=[];
    idx.forEach(function(m,rk){pos[m]=rk});
    return{len:s,pos:pos};
  }

  // timeline: steps start slow, then speed up
  var T0=0.7,starts=[],durs=[],t=T0;
  for(k=0;k<N;k++){var d=Math.max(0.17,1.35*Math.pow(0.76,k));starts.push(t);durs.push(d);t+=d}
  var TEND=t;
  window.DURATION=Math.min(10,Math.round((TEND+1.0)*10)/10);
  function stepAt(tt){if(tt<T0)return -1;for(var k=N-1;k>=0;k--)if(tt>=starts[k])return k;return -1}

  // grid
  var GX=38,GY=126,CS=44,GAP=6.5,cells=[],g=document.getElementById('grid');
  function cellXY(k){return[GX+(k%5)*(CS+GAP),GY+Math.floor(k/5)*(CS+GAP)]}
  for(k=0;k<N;k++){var p=cellXY(k);cells.push(el('rect',{x:p[0],y:p[1],width:CS,height:CS,rx:7,fill:WASH},g))}
  var ring=document.getElementById('ring');

  // bars
  var BX=468,BW=138,RY=126,RP=50.5,BH=24,bg=document.getElementById('bars'),rows=[];
  METHODS.forEach(function(m){
    var gg=el('g',{},bg);
    var tx=el('text',{x:330,y:6,'font-size':16,'font-weight':500},gg);tx.textContent=m[0];
    var bar=el('rect',{x:BX,y:-BH/2,height:BH,rx:5,fill:m[1]},gg);
    rows.push({g:gg,bar:bar,tx:tx});
  });

  var WIN=0.42,SAMP=28;
  window.renderAt=function(tt){
    // bars: smooth (raised-cosine) average of the step targets over the last WIN seconds
    var len=[0,0,0,0,0],pos=[0,0,0,0,0],wsum=0;
    for(var i=0;i<SAMP;i++){
      var u=(i+0.5)/SAMP,w=1-Math.cos(2*Math.PI*u),tg=target(stepAt(tt-WIN*(1-u)));
      wsum+=w;for(var m=0;m<M;m++){len[m]+=w*tg.len[m];pos[m]+=w*tg.pos[m]}
    }
    for(m=0;m<M;m++){
      var y=RY+CS/2+ (pos[m]/wsum)*RP;
      rows[m].g.setAttribute('transform','translate(0,'+y.toFixed(2)+')');
      rows[m].bar.setAttribute('width',(BW*len[m]/wsum).toFixed(2));
    }
    // cells take the winner's colour once that benchmark has been ranked
    for(var k=0;k<N;k++){
      var d=durs[k],a=ease((tt-starts[k]-Math.min(0.5,d*0.45))/Math.min(0.4,d));
      cells[k].setAttribute('fill',mix(WASH,METHODS[winner[k]][1],a));
    }
    // ring on the current benchmark, sliding from the previous one
    var cur=stepAt(tt);
    if(cur<0){ring.setAttribute('opacity',0)}
    else{
      var a2=ease((tt-starts[cur])/Math.min(0.3,durs[cur])),p1=cellXY(cur),p0=cur>0?cellXY(cur-1):p1;
      if(cur>0&&cur%5===0)p0=p1;
      ring.setAttribute('x',(p0[0]+(p1[0]-p0[0])*a2-3).toFixed(2));
      ring.setAttribute('y',(p0[1]+(p1[1]-p0[1])*a2-3).toFixed(2));
      ring.setAttribute('opacity',cur===0||cur%5===0?a2:1);
    }
  };
  window.renderAt(0);
})();
</script>
