<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Source+Serif+4:opsz,wght@8..60,400..600&display=block" rel="stylesheet">
<style>html,body{margin:0;width:640px;height:448px;overflow:hidden;background:#fffdf9}
svg{display:block;font-family:"Bricolage Grotesque",sans-serif}</style>
<svg id="s" width="640" height="448" viewBox="0 0 640 448" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const NS='http://www.w3.org/2000/svg', svg=document.getElementById('s');
function el(n,a,txt){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;svg.appendChild(e);return e}
const INK='#0f1c33',SOFT='#445267',FAINT='#6c7788',WASH='#f1ece1',BLUE='#1a55b4',PAPER='#fffdf9';
const ROWS=[{y:178,col:'#e0811f',tint:'#f8dfc0',name:'emotion'},{y:322,col:'#1e8f6b',tint:'#cdeadd',name:'personality'}];
const C=[72,180,288,396,510], BW=64,BH=54, CHX=474,CHW=130,CHH=44;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ss=x=>{x=clamp(x);return x*x*(3-2*x)};
const io=x=>{x=clamp(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
function hex(h){return [1,3,5].map(i=>parseInt(h.substr(i,2),16))}
function mix(a,b,t){const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'}

const g=el('defs',{}); g.innerHTML='<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf9"/><stop offset="1" stop-color="#f8f5ee"/></linearGradient>';
el('rect',{width:640,height:448,fill:'url(#bg)'});
const h=el('text',{x:40,y:88,'font-size':26,'font-weight':600,fill:INK});
h.innerHTML='Emotion and personality, learned <tspan fill="'+BLUE+'">jointly</tspan>';
['embed','conv','pool','dense'].forEach((l,i)=>el('text',{x:C[i],y:386,'font-size':15,fill:FAINT,'text-anchor':'middle'},l));
const flowLbl=el('text',{x:40,y:255,'font-size':16,'font-weight':500,fill:BLUE},'information flow');

// cross links
const links=[];
for(let i=1;i<=3;i++)for(let d=0;d<2;d++){
  const src=ROWS[d],dst=ROWS[1-d],dir=d==0?1:-1;
  const x1=C[i]+16,y1=src.y+dir*BH/2,x2=C[i+1]-16,y2=dst.y-dir*((i==3?CHH:BH)/2+3);
  const k=42*dir, P=[[x1,y1],[x1,y1+k],[x2,y2-k],[x2,y2]];
  const p=el('path',{d:`M${x1},${y1} C${x1},${y1+k} ${x2},${y2-k} ${x2},${y2}`,fill:'none',stroke:BLUE,'stroke-width':2,'stroke-linecap':'round',pathLength:1,'stroke-dasharray':'1 1'});
  const a=el('path',{d:`M${x2-5.5},${y2-dir*5} L${x2},${y2+dir*3} L${x2+5.5},${y2-dir*5} Z`,fill:BLUE});
  links.push({i,d,P,p,a,col:src.col});
}
// rows
const rows=ROWS.map((r,ri)=>{
  const o={r,blocks:[],stripes:[]};
  for(let i=0;i<4;i++){
    const xa=C[i]+BW/2+4, xb=(i==3?CHX:C[i+1]-BW/2)-6;
    el('line',{x1:xa,y1:r.y,x2:xb-3,y2:r.y,stroke:SOFT,'stroke-width':2});
    el('path',{d:`M${xb-6},${r.y-5} L${xb+2},${r.y} L${xb-6},${r.y+5} Z`,fill:SOFT});
  }
  for(let i=0;i<4;i++){
    o.blocks.push(el('rect',{x:C[i]-BW/2,y:r.y-BH/2,width:BW,height:BH,rx:9,fill:WASH,stroke:r.col,'stroke-width':2.5}));
    if(i>=2){const oc=ROWS[1-ri].col; o.stripes[i]=el('rect',{x:C[i]-BW/2+7,y:ri==0?r.y+BH/2-17:r.y-BH/2+7,width:BW-14,height:10,rx:4,fill:oc})}
  }
  o.chip=el('rect',{x:CHX,y:r.y-CHH/2,width:CHW,height:CHH,rx:22,fill:PAPER,stroke:r.col,'stroke-width':2.5});
  o.chipT=el('text',{x:CHX+CHW/2,y:r.y+5.5,'font-size':17,'font-weight':600,'text-anchor':'middle',fill:r.col},r.name);
  return o;
});
const xdots=links.map(l=>el('circle',{r:5.5,fill:l.col,stroke:PAPER,'stroke-width':2}));
const dots=rows.map(o=>el('circle',{r:7.5,cy:o.r.y,fill:o.r.col,stroke:PAPER,'stroke-width':2.5}));
function bez(P,u){const v=1-u,a=v*v*v,b=3*v*v*u,c=3*v*u*u,d=u*u*u;return [a*P[0][0]+b*P[1][0]+c*P[2][0]+d*P[3][0],a*P[0][1]+b*P[1][1]+c*P[2][1]+d*P[3][1]]}

window.DURATION=9;
const X0=30,X1=C[4];
window.renderAt=function(t){
  // pulse 1: 0.5-3.0, links: 3.0-4.9, pulse 2: 5.0-7.9
  const p1=clamp((t-0.5)/2.5), p2=clamp((t-5.0)/2.9);
  const x1=X0+(X1-X0)*io(p1)*0+ (X0+(X1-X0)*(0.15*p1+0.85*io(p1))-X0)*1;
  const xa=X0+(X1-X0)*(0.15*p1+0.85*io(p1)), xb=X0+(X1-X0)*(0.15*p2+0.85*io(p2));
  rows.forEach((o,ri)=>{
    o.blocks.forEach((b,i)=>{
      const f=ss((xa-(C[i]-BW/2))/BW);
      b.setAttribute('fill',mix(WASH,o.r.tint,f));
    });
    for(let i=2;i<4;i++){const s=ss((xb-(C[i]-22))/30);o.stripes[i].setAttribute('opacity',s);
      o.stripes[i].setAttribute('width',(BW-14)*(0.4+0.6*s));o.stripes[i].setAttribute('x',C[i]-(BW-14)*(0.4+0.6*s)/2)}
    const c1=ss((xa-(CHX-6))/30), c2=ss((xb-(CHX-6))/30);
    o.chip.setAttribute('fill',c2>0?mix(o.r.tint,o.r.col,c2):mix(PAPER,o.r.tint,c1));
    o.chipT.setAttribute('fill',mix(o.r.col,'#ffffff',c2));
    const d=dots[ri]; let x,op;
    if(t<5.0){x=xa;op=ss((t-0.4)/0.25)*(1-ss((xa-(CHX-14))/22))}
    else{x=xb;op=ss((t-5.0)/0.25)*(1-ss((xb-(CHX-14))/22))}
    d.setAttribute('cx',x);d.setAttribute('opacity',op);
  });
  links.forEach((l,k)=>{
    const st=3.0+(l.i-1)*0.42+l.d*0.12, p=io((t-st)/0.8);
    l.p.setAttribute('stroke-dashoffset',1-p);
    l.p.setAttribute('opacity',p>0?1:0);
    l.a.setAttribute('opacity',ss((p-0.85)/0.15));
    const u=(xb-C[l.i])/(C[l.i+1]-16-C[l.i]), q=bez(l.P,io(clamp(u)));
    const xd=xdots[k];xd.setAttribute('cx',q[0]);xd.setAttribute('cy',q[1]);
    xd.setAttribute('opacity',(u>0&&u<1&&p2>0)?ss(u/0.12)*ss((1-u)/0.1):0);
  });
  flowLbl.setAttribute('opacity',ss((t-3.1)/0.7));
};
window.renderAt(0);
</script>
