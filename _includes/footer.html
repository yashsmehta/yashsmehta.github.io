    <footer class="{% if site.footer_fixed %}fixed-bottom{% else %}sticky-bottom mt-5{% endif %}">
      <div class="container{% if site.footer_fixed %} mt-0{% endif %}">
        <span class="footer-quote">Live for the moments you can't put into words</span>
        <span class="footer-links">
          <a href="mailto:yashsmehta95@gmail.com" title="Email" aria-label="Email"><i class="fas fa-envelope"></i></a>
          {%- if site.scholar_userid %}
          <a href="https://scholar.google.com/citations?user={{ site.scholar_userid }}" title="Google Scholar" aria-label="Google Scholar"><i class="ai ai-google-scholar"></i></a>
          {%- endif %}
          {%- if site.github_username %}
          <a href="https://github.com/{{ site.github_username }}" title="GitHub" aria-label="GitHub"><i class="fab fa-github"></i></a>
          {%- endif %}
          {%- if site.linkedin_username %}
          <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}" title="LinkedIn" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
          {%- endif %}
          {%- if site.twitter_username %}
          <a href="https://twitter.com/{{ site.twitter_username }}" title="Twitter" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
          {%- endif %}
        </span>
      </div>
    </footer>
