<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Source+Serif+4:opsz,wght@8..60,400..600&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:640px;height:448px;overflow:hidden;background:linear-gradient(#fffdf9,#f8f5ee)}
canvas,svg{position:absolute;left:0;top:0;width:640px;height:448px}
svg{font-family:"Bricolage Grotesque",sans-serif}
.halo{paint-order:stroke;stroke:#fdfbf6;stroke-width:5px;stroke-linejoin:round}
</style>
<canvas id="c" width="1280" height="896"></canvas>
<svg id="s" width="640" height="448" viewBox="0 0 640 448" xmlns="http://www.w3.org/2000/svg">
  <text x="36" y="74" font-size="27" font-weight="600" fill="#0f1c33"><tspan fill="#e0811f">Coarse</tspan> labels, more human-like vision</text>
  <g id="dyn"></g>
</svg>
<script>
/* Teaser for "Extremely coarse learning objectives induce human-aligned representations in AI vision models"
   (arXiv:2605.05556).
   Left: how the coarse labels are built (Fig. 1a) - image embeddings are split at the median of principal
   component 1, then 2, then 3; an image's label is its pattern of signs, so 1,000 classes become 2, 4, 8.
   Right: what training on them gives (Fig. 4a) - RSA with human similarity judgments (THINGS) is 0.581 for
   the network trained on 8 classes and 0.367 for the same network trained on 1,000 classes. Those two
   numbers are from the paper; the point cloud is synthetic (seeded). */
(function(){
var NS='http://www.w3.org/2000/svg';
function el(n,a,p,txt){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;if(p)p.appendChild(e);return e}
function rng(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;var t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function cl(x){return x<0?0:x>1?1:x}
function ease(x){x=cl(x);return x*x*(3-2*x)}
function easeOut(x){x=cl(x);return 1-Math.pow(1-x,3)}
function seg(t,a,b){return cl((t-a)/(b-a))}
function mix3(a,b,k){return[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k]}
function css(c,al){return'rgba('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+','+(al===undefined?1:al)+')'}
function shade(c,f){return c.map(function(v){return f>0?v+(255-v)*f:v*(1+f)})}

var INK='#0f1c33',SOFT='#445267',FAINT='#6c7788',LINE='#d9d1c0';
var GREEN=[30,143,107],MINT=[88,195,155],ORANGE=[224,129,31],RED=[212,66,78],BLUE=[26,85,180];
var MANY=[GREEN,MINT,ORANGE,RED,[26,85,180],[104,172,229],[150,96,190],[226,178,52],[226,120,160],[108,119,136],[0,45,114],[120,170,70]];

/* ── synthetic embedding cloud: a few clumps, widest along x, then y, then z ── */
var R=rng(20260507);
function gauss(){var u=0;for(var i=0;i<6;i++)u+=R();return(u-3)/0.7071}
var cents=[],pts=[],NP=380,wsum=0;
[-1.38,-0.46,0.46,1.38].forEach(function(gx){[-0.68,0,0.68].forEach(function(gy){
  var w=0.55+R();wsum+=w;
  cents.push([gx+(R()-0.5)*0.5,gy+(R()-0.5)*0.36,gauss()*0.42,w]);
})});
function pick(){var u=R()*wsum;for(var i=0;i<cents.length;i++){u-=cents[i][3];if(u<=0)return cents[i]}return cents[0]}
while(pts.length<NP){
  var c=pick(),x=c[0]+gauss()*0.36,y=c[1]+gauss()*0.27,z=c[2]+gauss()*0.3;
  if(Math.abs(x)>1.95||Math.abs(y)>1.3||Math.abs(z)>1.05)continue;
  pts.push({x:x,y:y,z:z,many:MANY[Math.floor(R()*MANY.length)]});
}
/* median-centre each axis, so every split is an exact half; trim stragglers and centre again */
var BOX={x:1.9,y:1.4,z:1.15};
for(var pass=0;pass<4;pass++){
  ['x','y','z'].forEach(function(a){
    var v=pts.map(function(p){return p[a]}).sort(function(p,q){return p-q}),n=v.length,m=n%2?v[(n-1)/2]:(v[n/2-1]+v[n/2])/2;
    pts.forEach(function(p){p[a]-=m});
  });
  if(pass<3){pts=pts.filter(function(p){var u=p.x/BOX.x,v=p.y/BOX.y,w=p.z/BOX.z;return u*u+v*v+w*w<=1});if(pts.length%2)pts.pop()}
}
pts.forEach(function(p){
  var bx=p.x>=0,by=p.y>=0,bz=p.z>=0,quad=bx?(by?RED:ORANGE):(by?BLUE:GREEN);
  p.c=[p.many,bx?ORANGE:GREEN,quad,shade(quad,bz?-0.24:0.5)];
});

/* ── layout ── */
var CX=156,CY=234,S=61;                       // cloud centre and px per unit
var AX=[{L:1.98,name:'PC 1'},{L:1.6,name:'PC 2'},{L:1.5,name:'PC 3'}];
var YAW=-0.72,PITCH=0.3;
var BASE=330,SC=268,BW=78,B8=410,B1K=540;     // chart: baseline y, px per unit RSA, bar width, bar centres
var V8=0.581,V1K=0.367;                       // Fig. 4a, bootstrap mean RSA with the behavioural RDM

/* ── timeline (s) ── */
var T1=0.7,T2=2.0,T3=3.3,SWEEP=0.85;          // the three splits; T3 starts with the tilt
var T3A=T3+0.75;                              // PC 3 axis starts drawing
var TT=5.0,TB1=5.6,TB8=6.3,TC=7.3;            // train arrow, 1,000 bar, 8 bar, cortex line
window.DURATION=9;

var cv=document.getElementById('c'),ctx=cv.getContext('2d'),dyn=document.getElementById('dyn');

function arrow(g,x0,y0,x1,y1,col,w,op,head){
  var dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy);if(len<2||op<=0.01)return;
  dx/=len;dy/=len;var h=Math.min(head,len*0.6),bx=x1-dx*h,by=y1-dy*h,nx=-dy*h*0.5,ny=dx*h*0.5;
  el('line',{x1:x0,y1:y0,x2:bx,y2:by,stroke:col,'stroke-width':w,'stroke-linecap':'round',opacity:op},g);
  el('polygon',{points:x1+','+y1+' '+(bx+nx)+','+(by+ny)+' '+(bx-nx)+','+(by-ny),fill:col,opacity:op},g);
}

window.renderAt=function(t){
  while(dyn.firstChild)dyn.removeChild(dyn.firstChild);

  /* camera: face-on for the first two splits, then tilts to show depth */
  var tilt=ease(seg(t,T3,T3+1.1)),yaw=YAW*tilt,pitch=PITCH*tilt;
  var cy_=Math.cos(yaw),sy_=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  function proj(x,y,z){var x1=x*cy_+z*sy_,z1=-x*sy_+z*cy_,y1=y*cp-z1*sp;return[CX+x1*S,CY-y1*S,y*sp+z1*cp]}

  /* each axis is drawn tail to tip; points take their new colour as the tip passes them */
  var starts=[T1,T2,T3A],head=[];
  for(var a=0;a<3;a++)head.push(-AX[a].L+2*AX[a].L*ease(seg(t,starts[a],starts[a]+SWEEP)));

  /* dots */
  ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,640,448);
  var list=[];
  for(var i=0;i<pts.length;i++){
    var p=pts[i],co=[p.x,p.y,p.z],col=p.c[0];
    for(a=0;a<3;a++)col=mix3(col,p.c[a+1],ease((head[a]-co[a])/0.34));
    var q=proj(p.x,p.y,p.z);list.push([q[0],q[1],q[2],col]);
  }
  list.sort(function(u,v){return u[2]-v[2]});
  for(i=0;i<list.length;i++){
    var d=list[i],near=cl((d[2]+1.3)/2.6);
    ctx.fillStyle=css(d[3],0.9);
    ctx.beginPath();ctx.arc(d[0],d[1],3.5*(1+0.22*tilt*(near-0.5)),0,6.2832);ctx.fill();
  }

  /* axes and their labels */
  for(a=0;a<3;a++){
    var L=AX[a].L,pr=seg(t,starts[a],starts[a]+SWEEP);if(pr<=0)continue;
    var v0=[0,0,0],v1=[0,0,0],vL=[0,0,0];v0[a]=-L;v1[a]=head[a];vL[a]=L;
    var p0=proj(v0[0],v0[1],v0[2]),p1=proj(v1[0],v1[1],v1[2]),pL=proj(vL[0],vL[1],vL[2]);
    arrow(dyn,p0[0],p0[1],p1[0],p1[1],INK,2.4,cl(pr*8),10);
    var lo=ease(seg(t,starts[a]+SWEEP-0.25,starts[a]+SWEEP+0.2));
    if(lo>0){
      var at=a===0?{x:pL[0]+7,y:pL[1]+6,anchor:'start'}:a===1?{x:pL[0]+9,y:pL[1]+11,anchor:'start'}:{x:pL[0]-7,y:pL[1]+15,anchor:'end'};
      el('text',{x:at.x,y:at.y,'text-anchor':at.anchor,'font-size':18,'font-weight':500,fill:SOFT,opacity:lo,'class':'halo'},dyn,AX[a].name);
    }
  }

  /* class counter under the cloud: 1,000 -> 2 -> 4 -> 8 */
  var COUNTS=['1,000','2','4','8'],when=[T1+0.45,T2+0.45,T3A+0.45],stage=0,k;
  for(k=0;k<3;k++)if(t>=when[k])stage=k+1;
  var fo=stage===0?1:ease(seg(t,when[stage-1],when[stage-1]+0.3));
  function counter(str,op,dy){
    if(op<=0.01)return;
    var tx=el('text',{x:CX,y:386+dy,'text-anchor':'middle','font-size':22,opacity:op},dyn);
    el('tspan',{'font-weight':650,fill:INK},tx,str);el('tspan',{'font-weight':500,fill:SOFT},tx,' classes');
  }
  if(stage<3&&t>=when[stage]-0.22)counter(COUNTS[stage],1-ease(seg(t,when[stage]-0.22,when[stage])),0);
  else counter(COUNTS[stage],fo,(1-fo)*5);

  /* train arrow */
  var tr=ease(seg(t,TT,TT+0.55));
  if(tr>0){
    arrow(dyn,298,CY,298+44*tr,CY,FAINT,2.4,cl(tr*6),10);
    el('text',{x:320,y:CY-13,'text-anchor':'middle','font-size':18,'font-weight':500,fill:SOFT,opacity:ease(seg(t,TT+0.2,TT+0.6))},dyn,'train');
  }

  /* chart: match to human similarity judgments */
  var on=0.5+0.5*ease(seg(t,TT+0.2,TT+0.9));
  var g=el('g',{opacity:on},dyn);
  el('text',{x:475,y:118,'text-anchor':'middle','font-size':20,'font-weight':500,fill:SOFT},g,'match to human judgments');
  el('line',{x1:358,y1:BASE,x2:592,y2:BASE,stroke:LINE,'stroke-width':2,'stroke-linecap':'round'},g);
  el('text',{x:B8,y:BASE+27,'text-anchor':'middle','font-size':21,'font-weight':650,fill:INK},g,'8');
  el('text',{x:B1K,y:BASE+27,'text-anchor':'middle','font-size':21,'font-weight':650,fill:INK},g,'1,000');
  function bar(xc,val,pr,col,lab,lo){
    var h=val*SC*pr;if(h<0.5)return;
    var r=Math.min(7,h),x=xc-BW/2,y=BASE-h;
    el('path',{d:'M'+x+','+BASE+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+BW-r)+'Q'+(x+BW)+','+y+' '+(x+BW)+','+(y+r)+'V'+BASE+'Z',fill:col},dyn);
    if(lo>0)el('text',{x:xc,y:y-10,'text-anchor':'middle','font-size':21,'font-weight':650,fill:INK,opacity:lo},dyn,lab);
  }
  bar(B1K,V1K,easeOut(seg(t,TB1,TB1+0.8)),'#9aa5b6','0.37',ease(seg(t,TB1+0.55,TB1+0.9)));
  bar(B8,V8,easeOut(seg(t,TB8,TB8+1.0)),'#e0811f','0.58',ease(seg(t,TB8+0.75,TB8+1.1)));

  /* the neural result, in words: 8-class networks match or exceed 1,000-class ones in visual cortex */
  var co_=ease(seg(t,TC,TC+0.6));
  if(co_>0)el('text',{x:475,y:BASE+62,'text-anchor':'middle','font-size':18,'font-weight':500,fill:SOFT,opacity:co_},dyn,'on par or better in visual cortex');
};
window.renderAt(0);
})();
</script>
