<!-- Shared styles for publication entries (_layouts/bib.html).
     Included by the publications page. -->
<style>
.publications { margin-top: 0; }
.publications ol.bibliography {
  list-style: none;
  padding: 0;
  margin: 0;
}
.publications ol.bibliography > li { margin: 0; padding: 0; }

.publications h2.bibliography {
  font-family: var(--display);
  font-size: 0.95rem;
  font-weight: 650;
  letter-spacing: 0;
  color: var(--ink-faint);
  margin: 1.5rem 0 0 0;
  padding: 0 0 0.6rem 0;
  border: 0;
  text-align: left;
}
.publications h2.bibliography:first-child { margin-top: 0; }
.publications h2.bibliography.hidden { display: none; }

.publication-item {
  display: grid;
  grid-template-columns: 248px minmax(0, 1fr);
  column-gap: 1.75rem;
  padding: 1.5rem 0;
  border-top: 1px solid var(--line);
}
.publication-item.hidden { display: none; }
/* Arriving from a paper on the homepage (/publications/#key): clear of the fixed
   navbar, its notes shown, and marked for a moment. */
.publication-item { scroll-margin-top: 5.5rem; }
.publication-item:target { animation: pub-arrive 2.4s ease-out 0.3s backwards; }
@keyframes pub-arrive { from { background: var(--wash); box-shadow: 0 0 0 0.9rem var(--wash); } to { background: transparent; box-shadow: 0 0 0 0.9rem transparent; } }
@media (prefers-reduced-motion: reduce) { .publication-item:target { animation: none; } }

.pub-media { min-width: 0; }
.pub-under {                       /* under the clip: the venue's short name and year */
  margin: 0.6rem 0 0;
  padding: 0 0.1rem;
  font-family: var(--display);
  font-size: 0.8rem;
  line-height: 1.3;
}
.pub-venue { font-weight: 600; letter-spacing: 0.01em; color: var(--ink-soft); }

.pub-image {
  position: relative;
  width: 100%;
  aspect-ratio: 10 / 7;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  background: #fff;
}
.pub-image img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
/* A live schematic (see _includes/pub_figures.html) sits over the preview image,
   which stays as the fallback until the script marks the plate as live. */
.pub-image canvas,
.pub-image video {                 /* a `teaser` clip takes the place of a drawing */
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: none;
}
.pub-image video { object-fit: cover; }
.pub-image.figure-live canvas,
.pub-image.figure-live video { display: block; }
.pub-image.figure-live img { display: none; }
.preview-placeholder {
  width: 100%;
  height: 100%;
  background: var(--wash);
}

.pub-content { min-width: 0; }

.pub-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.35rem 1.25rem;
}

.pub-content .title {
  flex: 1 1 auto;
  min-width: 0;
  font-family: var(--display);
  font-weight: 650;
  font-size: 1.2rem;
  line-height: 1.25;
  letter-spacing: -0.015em;
  color: var(--ink);
  max-width: 34em;
  text-wrap: balance;
}

.pub-content .author {
  margin-top: 0.4rem;
  font-size: 0.98rem;
  line-height: 1.45;
  color: var(--ink-soft);
}
.publications ol.bibliography li .author > em,
.pub-content .author em {
  font-style: normal;
  font-weight: 650;
  color: var(--ink);
  border: 0;
}

.topic-tag {
  display: inline-flex;
  align-items: baseline;
  gap: 0.4rem;
  flex-shrink: 0;
  font-family: var(--display);
  font-size: 0.8rem;
  line-height: 1.3;
  color: var(--ink-faint);
  white-space: nowrap;
}
.topic-dot {
  display: inline-block;
  width: 0.55rem;
  height: 0.55rem;
  border-radius: 50%;
  background: var(--topic, var(--ink-faint));
  flex-shrink: 0;
  transform: translateY(-0.05em);
}
.topic-neuro-ai    { --topic: var(--c-red); }
.topic-discovery   { --topic: var(--link); }
.topic-personality { --topic: var(--c-green); }

.pub-links {
  display: flex;
  flex-wrap: wrap;
  column-gap: 1.2rem;
  row-gap: 0.3rem;
  margin-top: 0.7rem;
  font-family: var(--display);
  font-size: 0.875rem;
  font-weight: 500;
}
.pub-links a {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--link);
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  cursor: pointer;
  text-decoration: none;
}
.pub-links a:hover {
  color: var(--navy);
  text-decoration: underline;
  text-underline-offset: 0.2em;
}
.pub-links i { font-size: 0.8em; opacity: 0.85; }

/* Short lines in place of an abstract: the question, my contribution, findings.
   They are always in the layout (so nothing moves) and come in, one after another,
   while the pointer is over the entry or something in it has focus; an entry
   arrived at from the homepage (/publications/#key) shows them too. On screens
   with no hover they are folded away until the entry is tapped. */
.pub-notes {
  display: grid;
  row-gap: 0.28rem;
  margin: 0.85rem 0 0;
}
.pub-notes > div {
  display: grid;
  grid-template-columns: 6rem minmax(0, 1fr);
  column-gap: 0.7rem;
  align-items: baseline;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.pub-notes dt {
  font-family: var(--display);
  font-size: 0.74rem;
  font-weight: 550;
  letter-spacing: 0.01em;
  color: var(--ink-faint);
  white-space: nowrap;
}
.pub-notes dd {
  margin: 0;
  font-size: 0.88rem;
  line-height: 1.45;
  color: var(--ink-soft);
}
.publication-item:hover .pub-notes > div,
.publication-item:focus-within .pub-notes > div,
.publication-item:target .pub-notes > div,
.publication-item.notes-open .pub-notes > div { opacity: 1; transform: none; }
.publication-item:hover .pub-notes > div:nth-child(2),
.publication-item:focus-within .pub-notes > div:nth-child(2) { transition-delay: 0.07s; }
.publication-item:hover .pub-notes > div:nth-child(3),
.publication-item:focus-within .pub-notes > div:nth-child(3) { transition-delay: 0.14s; }
@media (prefers-reduced-motion: reduce) {
  .pub-notes > div { transform: none; transition: none; }
}
@media (hover: none) {
  .pub-notes { display: none; }
  .publication-item.notes-open .pub-notes,
  .publication-item:target .pub-notes { display: grid; }
}

/* Screens with no hover: a line above the list says that a tap shows the notes, which
   come in as they do under a pointer. */
.pubs-hint { display: none; }
@media (hover: none) {
  .pubs-hint {
    display: block;
    margin: 0 0 1.4rem;
    font-family: var(--display);
    font-size: 0.85rem;
    font-weight: 500;
    line-height: 1.4;
    color: var(--ink-faint);
    text-wrap: balance;
  }
  .pubs-hint i { margin-right: 0.4rem; font-size: 0.92em; }
  .publication-item { cursor: pointer; -webkit-tap-highlight-color: transparent; }   /* the pointer makes iOS treat the entry as something to tap */
  .publication-item.notes-open .pub-notes > div {
    @starting-style { opacity: 0; transform: translateY(4px); }
  }
  .publication-item.notes-open .pub-notes > div:nth-child(2) { transition-delay: 0.07s; }
  .publication-item.notes-open .pub-notes > div:nth-child(3) { transition-delay: 0.14s; }
}

@media (max-width: 768px) {
  .pub-head { flex-direction: column; gap: 0.3rem; }
}

/* ── Small tablets: a narrower clip column; the notes' labels go above their lines ── */
@media (max-width: 640px) {
  .publication-item {
    grid-template-columns: 11.5rem minmax(0, 1fr);
    column-gap: 1.25rem;
    padding: 1.3rem 0;
  }
  .pub-content .title { font-size: 1.1rem; }
  .pub-content .author { font-size: 0.95rem; }
  .pub-links { column-gap: 1.4rem; row-gap: 0; margin: 0.35rem 0 -0.4rem; }
  .pub-links a { padding: 0.4rem 0; }                      /* taller targets on the same line */
  .pub-notes { row-gap: 0.5rem; }
  .pub-notes > div { grid-template-columns: minmax(0, 1fr); }
  .pub-notes dd { font-size: 0.9rem; }
}
/* ── Phones: one column. The clip runs the width of the page with the venue under it,
   then the title, topic, authors and links; the notes, after a tap, have that whole width too. ── */
@media (max-width: 480px) {
  .publications h2.bibliography { margin-top: 1.75rem; }
  .publication-item {
    grid-template-columns: minmax(0, 1fr);
    row-gap: 0.9rem;
    padding: 1.4rem 0 1.5rem;
  }
  .pub-under { margin-top: 0.55rem; }
  .pub-content .title { font-size: 1.15rem; }
  .pub-notes { row-gap: 0.4rem; margin-top: 1rem; }
  .pub-notes > div { grid-template-columns: 6rem minmax(0, 1fr); column-gap: 0.65rem; }   /* room again for the label beside its line */
}
@media (max-width: 359px) {
  .pub-notes { row-gap: 0.5rem; }
  .pub-notes > div { grid-template-columns: minmax(0, 1fr); }
}
</style>
<script>
// Screens with no hover: a tap on an entry (not on a link in it) shows or hides its notes.
document.addEventListener('DOMContentLoaded', function () {
  if (!window.matchMedia('(hover: none)').matches) return;
  document.querySelectorAll('.publication-item').forEach(function (item) {
    if (!item.querySelector('.pub-notes')) return;
    item.addEventListener('click', function (e) {
      if (e.target.closest('a')) return;
      item.classList.toggle('notes-open');
    });
  });
});
</script>
