<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Source+Serif+4:opsz,wght@8..60,400..600&display=block" rel="stylesheet">
<style>html,body{margin:0;width:640px;height:448px;overflow:hidden;background:#fffdf9}
svg{display:block}text{font-family:"Bricolage Grotesque";}</style>
<svg id="s" width="640" height="448" viewBox="0 0 640 448" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const INK='#0f1c33',SOFT='#445267',FAINT='#6c7788',LINE='#e4ddcf',WASH='#f1ece1',NAVY='#002d72',BLUE='#1a55b4',SKY='#68ace5',ORANGE='#e0811f';
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('s');
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||root).appendChild(e);return e}
let seed=7;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const clamp=x=>Math.max(0,Math.min(1,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const seg=(t,a,b)=>ease((t-a)/(b-a));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const mix=(a,b,u)=>a+(b-a)*u;
function hex(c){return [1,3,5].map(i=>parseInt(c.substr(i,2),16))}
function col(a,b,u){const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(mix(v,B[i],u))).join(',')+')'}

el('rect',{x:0,y:0,width:640,height:448,fill:'#fffdf9'},svg);
// heading
const h=el('text',{x:42,y:82,'font-size':26,'font-weight':600,fill:INK},svg);
h.innerHTML='Personality from text: <tspan fill="'+ORANGE+'">bottom-up</tspan> + <tspan fill="'+BLUE+'">top-down</tspan>';
const root=el('g',{transform:'translate(14,6)'},svg);

// connectors (static, faint)
const pTop='M140 228 C165 228 160 173 184 173', pBot='M140 272 C165 272 160 330 184 330';
function arrowHead(x,y,c){return el('path',{d:`M${x-7} ${y-5} L${x} ${y} L${x-7} ${y+5}`,fill:'none',stroke:c,'stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'})}
const cTop=el('path',{d:pTop,fill:'none',stroke:'#cfc7b6','stroke-width':2}), cBot=el('path',{d:pBot,fill:'none',stroke:'#cfc7b6','stroke-width':2});
const aTop=arrowHead(186,173,'#cfc7b6'), aBot=arrowHead(186,330,'#cfc7b6');
const pulseTop=el('path',{d:pTop,fill:'none',stroke:BLUE,'stroke-width':3.5,'stroke-linecap':'round'});
const LT=pulseTop.getTotalLength();
const pathBot=cBot, LB=cBot.getTotalLength();
const s1=el('path',{fill:'none',stroke:'#cfc7b6','stroke-width':2}), s2=el('path',{fill:'none',stroke:'#cfc7b6','stroke-width':2});

// text card
el('rect',{x:36,y:190,width:104,height:120,rx:9,fill:'#fff',stroke:'#d9d1c0','stroke-width':2});
const words=[];
for(let r=0;r<6;r++){let x=48;const y=205+r*17;const maxx=r==5?100:128;
  while(x<maxx-10){let w=Math.round(12+rnd()*20);if(x+w>maxx)w=maxx-x;if(w<8)break;
    words.push({x,y,w,e:el('rect',{x,y,width:w,height:7,rx:3.5,fill:'#cfc7b6'})});x+=w+5}}
const hiIdx=[1,4,7,10,13,16].filter(i=>i<words.length);
hiIdx.forEach((i,k)=>{words[i].hi=k});
const lab=(x,y,s,c,w)=>{const t=el('text',{x,y,'text-anchor':'middle','font-size':17,'font-weight':w||500,fill:c||SOFT});t.textContent=s;return t};
lab(88,336,'text');
// scanning band on card
const band=el('rect',{x:38,y:192,width:100,height:16,rx:4,fill:SKY,opacity:0});

// top stream: language model = stacked layers
const lTop=lab(232,128,'language model');
const layers=[189,166,143].map(y=>el('rect',{x:192,y,width:82,height:17,rx:5,fill:'#fff',stroke:'#cfc7b6','stroke-width':2}));
// bottom stream: counts
const lBot=lab(232,386,'psycholinguistic');
el('path',{d:'M190 360 H276',stroke:'#cfc7b6','stroke-width':2,'stroke-linecap':'round'});
const barH=[30,52,22,42,34];
const bars=barH.map((hh,i)=>({hh,x:194+i*16.5,ghost:el('rect',{x:194+i*16.5,y:359-hh,width:12,height:hh,rx:3,fill:WASH}),e:el('rect',{x:194+i*16.5,y:359,width:12,height:0,rx:3,fill:ORANGE})}));

// vectors
const CW=18,CH=16,N=5;
function vec(c,light){const g=el('g',{});const cells=[];for(let i=0;i<N;i++){const sh=0.25+0.75*rnd();
  cells.push({sh,e:el('rect',{x:0,y:i*CH,width:CW,height:CH,fill:'#fff',stroke:'#cfc7b6','stroke-width':1.5},g)})}
  const fr=el('rect',{x:0,y:0,width:CW,height:CH*N,rx:2,fill:'none',stroke:'#cfc7b6','stroke-width':2.5},g);return {g,cells,fr,c,light}}
const vT=vec(BLUE,'#dbe9f8'), vB=vec(ORANGE,'#fbe6cd');

// fan + traits
const TX=566, TY=[170,210,250,290,330], traits='OCEAN'.split('');
const fans=TY.map(y=>el('path',{d:`M446 250 C490 250 500 ${y} ${TX-19} ${y}`,fill:'none',stroke:SOFT,'stroke-width':2,'stroke-linecap':'round'}));
const fanL=fans.map(f=>f.getTotalLength());
const circ=TY.map((y,i)=>{const c=el('circle',{cx:TX,cy:y,r:16,fill:'#fff',stroke:'#cfc7b6','stroke-width':2});
  const t=el('text',{x:TX,y:y+6,'text-anchor':'middle','font-size':17,'font-weight':600,fill:FAINT});t.textContent=traits[i];return {c,t}});
lab(TX,372,'Big Five');

// flying dots
const dots=hiIdx.map(()=>el('circle',{r:4.5,fill:ORANGE,opacity:0}));

window.DURATION=8.6;
window.renderAt=function(t){
  // --- bottom-up: words highlight, dots fly to bars
  const scan=seg(t,2.9,3.7);
  words.forEach((w,i)=>{
    const row=(w.y-205)/17;
    const blue=clamp(scan*7-row);
    let f=col('#cfc7b6',SKY,blue);
    if(w.hi!==undefined){const u=seg(t,0.4+w.hi*0.16,0.75+w.hi*0.16);f=col('#cfc7b6',ORANGE,u)}
    w.e.setAttribute('fill',f)});
  hiIdx.forEach((wi,k)=>{const w=words[wi],a=0.75+k*0.16,u=seg(t,a,a+0.85);
    const d=dots[k],b=bars[k%bars.length];
    const sx=w.x+w.w/2,sy=w.y+3.5,ex=b.x+6,ey=359-b.hh/2;
    // go along bottom connector then to bar
    let x,y;
    if(u<0.25){const v=u/0.25,p=pathBot.getPointAtLength(0);x=mix(sx,p.x,ease(v));y=mix(sy,p.y,ease(v))}
    else if(u<0.75){const p=pathBot.getPointAtLength(LB*(u-0.25)/0.5);x=p.x;y=p.y}
    else{const v=(u-0.75)/0.25,p=pathBot.getPointAtLength(LB);x=mix(p.x,ex,v);y=mix(p.y,ey,v)}
    d.setAttribute('cx',x);d.setAttribute('cy',y);
    d.setAttribute('opacity',u<=0||u>=1?0:Math.min(1,u*8,(1-u)*8))});
  bars.forEach((b,i)=>{const a=1.5+i*0.16;const u=seg(t,a,a+0.55),hh=b.hh*u;
    b.e.setAttribute('y',359-hh);b.e.setAttribute('height',hh)});
  const botOn=seg(t,0.4,1.0);
  cBot.setAttribute('stroke',col('#cfc7b6',ORANGE,botOn));aBot.setAttribute('stroke',col('#cfc7b6',ORANGE,botOn));
  lBot.setAttribute('fill',col(SOFT,'#b8640f',botOn));
  s2.setAttribute('stroke',col('#cfc7b6',ORANGE,seg(t,2.2,2.5)));
  vB.cells.forEach((c,i)=>{const u=seg(t,2.4+(N-1-i)*0.07,2.75+(N-1-i)*0.07);
    c.e.setAttribute('fill',col('#ffffff',col2(vB.light,vB.c,c.sh),u));c.e.setAttribute('stroke',col('#cfc7b6','#fffdf9',u))});
  vB.fr.setAttribute('stroke',col('#cfc7b6',ORANGE,seg(t,2.4,2.9)));

  // --- top-down: scan whole text, pulse into model, layers light
  const by=mix(192,292,lin(t,2.9,3.7));
  band.setAttribute('y',by);band.setAttribute('opacity',0.28*Math.min(lin(t,2.9,3.05),1-lin(t,3.55,3.75)));
  const topOn=seg(t,2.9,3.5);
  lTop.setAttribute('fill',col(SOFT,BLUE,topOn));
  const pu=seg(t,3.4,4.0);
  cTop.setAttribute('stroke',col('#cfc7b6',BLUE,seg(t,3.5,4.0)));aTop.setAttribute('stroke',col('#cfc7b6',BLUE,seg(t,3.8,4.1)));
  const pl=18;pulseTop.setAttribute('stroke-dasharray',`${pl} ${LT+pl}`);pulseTop.setAttribute('stroke-dashoffset',pl-pu*(LT+pl));
  pulseTop.setAttribute('opacity',pu>0&&pu<1?1:0);
  layers.forEach((l,i)=>{const a=3.95+i*0.22,u=seg(t,a,a+0.35);
    l.setAttribute('fill',col('#ffffff',[SKY,'#3f80cc',BLUE][i],u));l.setAttribute('stroke',col('#cfc7b6',BLUE,u))});
  s1.setAttribute('stroke',col('#cfc7b6',BLUE,seg(t,4.6,4.9)));
  vT.cells.forEach((c,i)=>{const u=seg(t,4.75+i*0.07,5.1+i*0.07);
    c.e.setAttribute('fill',col('#ffffff',col2(vT.light,vT.c,c.sh),u));c.e.setAttribute('stroke',col('#cfc7b6','#fffdf9',u))});
  vT.fr.setAttribute('stroke',col('#cfc7b6',BLUE,seg(t,4.75,5.25)));

  // --- join
  const j=seg(t,5.6,6.6);
  const vx=mix(306,424,j),yT=mix(133,170,j),yB=mix(290,250,j);
  vT.g.setAttribute('transform',`translate(${vx},${yT})`);
  vB.g.setAttribute('transform',`translate(${vx},${yB})`);
  const mx=(282+vx-7)/2;
  s1.setAttribute('d',`M282 173 C${mx} 173 ${mx} ${yT+40} ${vx-7} ${yT+40}`);
  s2.setAttribute('d',`M282 330 C${mx} 330 ${mx} ${yB+40} ${vx-7} ${yB+40}`);

  // --- classify
  fans.forEach((f,i)=>{const u=seg(t,6.7+i*0.05,7.3+i*0.05);
    f.setAttribute('stroke-dasharray',`${fanL[i]} ${fanL[i]}`);f.setAttribute('stroke-dashoffset',fanL[i]*(1-u));f.setAttribute('opacity',u>0?1:0)});
  circ.forEach((c,i)=>{const a=7.15+i*0.1,u=seg(t,a,a+0.4);
    c.c.setAttribute('fill',col('#ffffff',NAVY,u));c.c.setAttribute('stroke',col('#cfc7b6',NAVY,u));
    c.c.setAttribute('r',16+2.5*Math.sin(Math.PI*u));c.t.setAttribute('fill',col(FAINT,'#ffffff',u))});
};
function col2(a,b,u){const A=hex(a),B=hex(b);return '#'+A.map((v,i)=>Math.round(mix(v,B[i],u)).toString(16).padStart(2,'0')).join('')}
window.renderAt(0);
</script>
